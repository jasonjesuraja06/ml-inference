# Measures dynamic INT8 against FP32 on x86-64.
#
# The development host is an Apple M4 Pro, where INT8 is not faster than FP32.
# That is a real measurement but a host-specific one: dynamic INT8 is a bet on
# integer dot-product instructions, and which of those exist depends on the
# CPU. Running the same probe on GitHub Actions produces the other half of the
# comparison from a public run rather than from a claim.
#
# The matrix is not four copies of one measurement. `ubuntu-latest` is a pool
# of different machines, and the CPU a job lands on is not chosen by the job:
# some allocations are Intel parts carrying AVX-512 VNNI, others are AMD Zen 3
# parts with neither AVX-512 nor VNNI. Four parallel jobs sample that pool, and
# each records the CPU model and flags it actually got, so a report is never
# separable from the instruction set that produced it. Reports are named after
# the CPU's INT8 capability, so two jobs that land on different hardware cannot
# be mistaken for one measurement.
name: arch-bench

on:
  push:
    branches: [main]
    paths:
      - "src/ml_inference/arch_bench.py"
      - "src/ml_inference/export_onnx.py"
      - "src/ml_inference/quantize_onnx.py"
      - "src/ml_inference/hostinfo.py"
      - ".github/workflows/arch-bench.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  x86-int8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Record the CPU this job landed on
        run: |
          mkdir -p bench/reports
          lscpu | tee bench/reports/ci_runner_cpu.txt
          echo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' \
            | grep -E '^(avx2|avx512f|avx512_vnni|avx_vnni|amx_int8)$' \
            || echo "no avx512/vnni/amx flags present"

      - name: Create environment
        run: |
          uv venv --python 3.12 .venv
          # CPU-only torch: the default PyPI wheel pulls the CUDA runtime,
          # which this runner has no GPU to use.
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e .

      - name: FP32 against INT8 latency
        env:
          PYTHONPATH: src:.
          ARCH_BENCH_THREADS: "4"
          ARCH_BENCH_SAMPLES: "100"
        run: |
          .venv/bin/python -m ml_inference.arch_bench 2>&1 \
            | tee bench/reports/arch_bench_ci.log

      - name: Summarise
        run: |
          {
            echo "### x86-64 INT8 against FP32 (probe ${{ matrix.probe }})"
            echo
            echo '```json'
            cat bench/reports/arch_latency_*_untrained.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-latency-probe-${{ matrix.probe }}
          path: |
            bench/reports/arch_latency_*_untrained.json
            bench/reports/arch_bench_ci.log
            bench/reports/ci_runner_cpu.txt
          if-no-files-found: error
