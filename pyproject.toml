[project]
name = "ml-inference"
version = "0.1.0"
description = "CWE classification of C/C++ functions: transformer fine-tune, ONNX INT8 quantization, and a FastAPI inference service."
authors = [{name = "Jason Jesuraja", email = "jimbono@gmail.com"}]
requires-python = ">=3.11,<3.14"
readme = "README.md"

dependencies = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",  # required by transformers.Trainer
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "optimum[onnxruntime]>=1.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "xxhash>=3.5.0",
    "locust>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/jasonjesuraja06/ml-inference"
Repository = "https://github.com/jasonjesuraja06/ml-inference"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
